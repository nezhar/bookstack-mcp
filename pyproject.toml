[project]
name = "bookstack-mcp"
version = "0.1.0.dev0"
description = "MCP server for BookStack"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harald Nezbeda", email = "hn@nezhar.com" }]
dependencies = [
    "fastmcp==4.1.4",
    "httpx2>=2.16,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
bookstack-mcp = "bookstack_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/nezhar/bookstack-mcp"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookstack_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Docker and a BookStack test instance",
]
