name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tool reference is current
        run: |
          uv run python scripts/gen_tool_docs.py
          git diff --exit-code docs/tools.md || {
            echo "::error file=docs/tools.md::docs/tools.md is stale; run 'uv run python scripts/gen_tool_docs.py' and commit it"
            exit 1
          }

      - name: Tests (unit and protocol)
        run: uv run pytest tests/unit tests/protocol --cov=bookstack_mcp

      - name: Dependency audit
        run: |
          uv export --frozen --format requirements-txt --no-hashes > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: 3.99.7
          extra_args: --results=verified,unknown
